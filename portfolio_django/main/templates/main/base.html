{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Naimesh Padhi — CSE student specializing in Data Science, building practical software projects.">
  <title>{% block title %}Naimesh Padhi — Portfolio{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <div class="page-doodles" aria-hidden="true">
    <span class="doodle doodle-book">📚</span>
    <span class="doodle doodle-code">&lt;/&gt;</span>
    <span class="doodle doodle-star">✦</span>
    <span class="doodle doodle-data">01</span>
  </div>

  <nav class="navbar">
    <a href="{% url 'home' %}" class="nav-logo">NP<span>.</span></a>
    <div class="nav-links">
      <a href="{% url 'home' %}#about">About</a>
      <a href="{% url 'home' %}#journey">Journey</a>
      <a href="{% url 'home' %}#projects">Projects</a>
      <a href="{% url 'home' %}#skills">Skills</a>
      <a href="{% url 'home' %}#focus">Learning</a>
      <a href="{% url 'home' %}#goals">Goals</a>
      <a href="{% url 'home' %}#contact">Contact</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; {% now "Y" %} Naimesh Padhi</p>
    <span>Built with Django · Learning, building, improving.</span>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="{% static 'main/js/script.js' %}"></script>
</body>
</html>
